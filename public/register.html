<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte - Pixabaie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-badge"><span>P</span></span>
      <span class="logo-word">Pixa<span class="accent">baie</span></span>
    </a>
    <nav class="nav-links">
      <a href="login.html" class="btn btn-outline">Connexion</a>
    </nav>
  </header>

  <main class="auth-page">
    <form id="registerForm" class="auth-form">
      <h1>Rejoindre Pixabaie</h1>
      <p class="auth-sub">Créez votre compte pour publier vos photos.</p>
      <p id="errorBox" class="error-box" hidden></p>

      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" required minlength="3" autocomplete="username">

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="password">Mot de passe</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">

      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">

      <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
      <p class="auth-switch">Déjà inscrit ? <a href="login.html">Connectez-vous</a></p>
    </form>
  </main>

  <script type="module" src="js/register.js"></script>
</body>
</html>
