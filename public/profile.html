<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - Pixabaie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-badge"><span>P</span></span>
      <span class="logo-word">Pixa<span class="accent">baie</span></span>
    </a>
    <nav class="nav-links" id="navLinks"></nav>
  </header>

  <main>
    <section id="profileHeader" class="profile-header">
      <div class="profile-banner"></div>
      <div class="profile-header-content">
        <div id="profileAvatarWrap" class="profile-avatar-wrap"></div>
        <div class="profile-info">
          <h1 id="profileUsername">—</h1>
          <p id="profileBio" class="profile-bio"></p>
          <div class="profile-stats" id="profileStats"></div>
        </div>
        <button id="editProfileBtn" class="btn btn-outline" hidden>Modifier le profil</button>
      </div>
    </section>

    <div id="profileGallery" class="gallery"></div>
    <p id="profileEmptyMessage" class="empty-message" hidden><strong>Aucune photo publiée</strong>Les photos publiées apparaîtront ici.</p>
    <p id="notFoundMessage" class="empty-message" hidden><strong>Utilisateur introuvable</strong>Vérifiez le lien ou retournez à l'accueil.</p>
  </main>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
