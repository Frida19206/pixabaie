<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Pixabaie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-badge"><span>P</span></span>
      <span class="logo-word">Pixa<span class="accent">baie</span></span>
    </a>
    <nav class="nav-links">
      <a href="register.html" class="btn btn-outline">Créer un compte</a>
    </nav>
  </header>

  <main class="auth-page">
    <form id="loginForm" class="auth-form">
      <h1>Content de vous revoir</h1>
      <p class="auth-sub">Connectez-vous pour retrouver votre galerie.</p>
      <p id="errorBox" class="error-box" hidden></p>

      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" required autocomplete="username">

      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      <p class="auth-switch">Pas encore de compte ? <a href="register.html">Inscrivez-vous</a></p>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
