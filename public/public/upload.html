<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publier une image - Pixabaie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-badge"><span>P</span></span>
      <span class="logo-word">Pixa<span class="accent">baie</span></span>
    </a>
    <nav class="nav-links" id="navLinks"></nav>
  </header>

  <main class="auth-page">
    <form id="uploadForm" class="auth-form" enctype="multipart/form-data">
      <h1>Publier une photo</h1>
      <p class="auth-sub">Elle apparaîtra immédiatement dans la galerie.</p>
      <p id="errorBox" class="error-box" hidden></p>

      <label for="imageFile">Photo</label>
      <label class="dropzone" id="dropzone">
        <svg id="dzIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 16.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5M7 9l5-5 5 5M12 4v13" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="dz-title" id="dzTitle">Glissez une image ici</span>
        <span class="dz-sub" id="dzSub">ou cliquez pour parcourir · JPEG, PNG, WEBP, GIF · 5 Mo max</span>
        <img id="previewImg" class="dropzone-preview" hidden alt="Aperçu">
        <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp,image/gif" required>
      </label>

      <label for="title">Titre</label>
      <input type="text" id="title" placeholder="Donnez un titre à votre photo" required>

      <label for="category">Catégorie</label>
      <select id="category"></select>

      <button type="submit" class="btn btn-primary btn-block">Publier</button>
    </form>
  </main>

  <script type="module" src="js/upload.js"></script>
</body>
</html>
